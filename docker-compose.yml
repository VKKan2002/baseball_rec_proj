services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: baseball
      POSTGRES_PASSWORD: baseball
      POSTGRES_DB: baseball
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseball -d baseball"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      # service-to-service networking: the internal Postgres port (5432),
      # not the host-mapped 15432 used by .env for local (non-Docker) runs.
      DATABASE_URL: postgresql+psycopg://baseball:baseball@postgres:5432/baseball
      DOLLARS_PER_WAR: 8000000
      DISCOUNT_RATE: 0.08
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: